<style>
    body {
        font-size: 16px;
        background: #f9f9f9;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

h2 {
    text-align: center;
    text-decoration: underline;
}
form {
    width: 300px;
    background: #fff;
    padding: 1rem;
    border: 1px solid #ccc;
    margin: 1rem auto;
    border-radius: 5px;
}
label {
    display: block;
    margin-bottom: 5px
}
label i {
    color: #999;
    font-size: 80%;
}
input, select {
    border: 1px solid #ccc;
    padding: 10px;
    display: block;
    width: 100%;
    box-sizing: border-box;
    border-radius: 2px;
}
.row {
    padding-bottom: 10px;
}
.form-inline {
    border: 1px solid #ccc;
    padding: 8px 10px 4px;
    border-radius: 2px;
}
.form-inline label, .form-inline input {
    display: inline-block;
    width: auto;
    padding-right: 15px;
}
.error {
    color: red;
    font-size: 90%;
}
button {
    background: #006dcc;
    padding: .5rem;
    color: #fff;
    margin-top: 10px;
    cursor: pointer;
    width: 100%;
}
button:hover {
    background: #0165b6;
}
button:disabled,button:disabled:hover {
    background-color: #999;
}
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 2fr;
    }
    pre,h1 {
        margin: .5rem;
    }
</style>
